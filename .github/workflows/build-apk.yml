name: Crear APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Preparar proyecto
        run: |
          unzip -q MyHomeTVAcademy_prototipo_v3.zip
          echo "Proyecto preparado"

      - name: Compilar APK
        run: gradle -p MyHomeTVAcademy assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MyHomeTVAcademy-APK
          path: MyHomeTVAcademy/app/build/outputs/apk/debug/app-debug.apk
